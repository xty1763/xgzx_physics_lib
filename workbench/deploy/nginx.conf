# 高中物理教师智能教学工作台 —— nginx 站点配置
# 用法：
#   sudo cp nginx.conf /etc/nginx/sites-available/physics-workbench
#   sudo ln -sf /etc/nginx/sites-available/physics-workbench /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 有域名就填域名；没有就先留 _ （用 IP 访问）
    server_name _;

    root /var/www/physics-workbench;
    index index.html;

    # 单页/静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML/JS/CSS/JSON 不做长缓存（改版后立即生效，配合 ?v= 破缓存）
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }

    # 图片/字体等长缓存
    location ~* \.(png|jpe?g|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 若把课件等大文件放到服务器（可选）
    # location /files/ {
    #     alias /var/www/physics-workbench/files/;
    #     add_header Cache-Control "public, max-age=86400";
    # }

    # 大文件上传/下载（课件可到 100MB+）
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

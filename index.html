<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中物理教学资源库</title>
  <meta name="description" content="高中物理教学资源库 —— 按章节分类、支持搜索与上传的导航页面。" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6fed'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='Arial'%3E%E7%89%A9%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">物</div>
      <div>
        <div class="name">高中物理教学资源库</div>
        <div class="sub" id="subjectSub"></div>
      </div>
    </div>

    <div class="searchwrap">
      <span class="icon">🔍</span>
      <input id="search" type="search" placeholder="搜索标题、描述、标签或章节…" autocomplete="off" />
    </div>

    <button class="btn primary" id="uploadBtn" type="button" style="display:none;">⬆ 上传资源</button>
    <button class="btn ghost" id="adminBtn" type="button">🔑 管理员登录</button>
  </header>

  <div class="layout">
    <!-- 章节导航 -->
    <aside class="sidebar">
      <h2>教材 · 章节</h2>
      <button class="nav-all active" data-chapter="all" type="button">📚 全部资源</button>
      <div id="chapterNav"></div>
    </aside>

    <!-- 主内容 -->
    <main class="content">
      <div class="toolbar">
        <div class="crumb" id="crumb">全部资源 <small id="count"></small></div>
        <div class="filterrow" id="typeFilter"></div>
      </div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <!-- 上传弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header>
        <h3 id="modalTitle">上传资源</h3>
        <button class="close" id="closeModal" type="button" aria-label="关闭">✕</button>
      </header>
      <div class="body">
        <div class="field">
          <label for="fTitle">资源名称 *</label>
          <input id="fTitle" type="text" placeholder="例如：匀变速直线运动演示" />
        </div>
        <div class="field">
          <label for="fType">资源类型</label>
          <select id="fType"></select>
          <p class="hint" id="typeHint" style="display:none;">试卷不挂具体小节（可不选章节/小节）。</p>
        </div>
        <div class="field">
          <label for="fBook">教材</label>
          <select id="fBook"></select>
        </div>
        <div class="fieldrow">
          <div class="field">
            <label for="fChapter">章节</label>
            <select id="fChapter"></select>
          </div>
          <div class="field">
            <label for="fSection">小节</label>
            <select id="fSection"></select>
          </div>
        </div>
        <div class="field">
          <label for="fDesc">一句话描述</label>
          <textarea id="fDesc" placeholder="简单说明这个资源的内容/用法（可选）"></textarea>
        </div>
        <div class="field">
          <label for="fTags">标签（用逗号或空格分隔）</label>
          <input id="fTags" type="text" placeholder="例如：演示 实验 动画" />
        </div>
        <div class="field">
          <label>选择 HTML 文件</label>
          <div class="dropzone" id="dropzone">
            <div class="big">📄</div>
            <div>点击选择，或把 <b>.html</b> 文件拖到这里</div>
            <small>文件内容会保存在当前浏览器（本地测试用）</small>
            <input id="fileInput" type="file" accept=".html,.htm" hidden />
          </div>
          <div class="filepill" id="filePill" style="display:none;">
            <span id="fileName"></span>
            <button class="x" id="clearFile" type="button" aria-label="移除">✕</button>
          </div>
        </div>
        <p class="hint">保存后资源会发布到线上（写入仓库并登记到资源清单），约 1 分钟后所有访客均可访问。</p>
      </div>
      <footer>
        <button class="btn" id="cancelModal" type="button">取消</button>
        <button class="btn primary" id="saveResource" type="button">保存资源</button>
      </footer>
    </div>
  </div>

  <!-- 管理员登录弹窗 -->
  <div class="modal-mask" id="adminMask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
      <header>
        <h3 id="adminTitle">管理员登录</h3>
        <button class="close" id="closeAdminModal" type="button" aria-label="关闭">✕</button>
      </header>
      <div class="body">
        <div class="field">
          <label for="adminToken">GitHub 访问令牌（只保存在本浏览器，用于发布资源）</label>
          <input id="adminToken" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" />
          <p class="hint">令牌只存在你这台浏览器的 localStorage，不会写进网页。当前<strong>没有</strong>令牌的访客看不到“上传资源”按钮；输入一次后，本浏览器即保留并使用它上传。</p>
        </div>
        <div id="adminLoggedInRow" style="display:none;">
          <button class="btn" id="clearTokenBtn" type="button">退出 / 清除本机令牌</button>
        </div>
      </div>
      <footer>
        <button class="btn" id="cancelAdminModal" type="button">取消</button>
        <button class="btn primary" id="adminSave" type="button">登录</button>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 数据与逻辑 -->
  <script src="data/course-data.js"></script>
  <script src="data/resources.js"></script>
  <script src="app.js"></script>
</body>
</html>
